<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Unión con el JavaScript usando Módulos ES -->
    <script defer type="module" src="/src/appTiempo.js"></script>
    <!-- Unión con el CSS --> 
    <link rel="stylesheet" href="/src/appTiempo.css">

    <!-- Vínculo de las fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,100..900;1,8..30,100..900&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="src/assets/img/sun.png">
    <title>Tiempo</title>
</head>
<body>
    <!--No se acepta el uso del JavaScript por cualquier razón-->
    <noscript>
        <p>Este mensaje solo se muestra si JavaScript está desactivado</p>
    </noscript>
    <!--///////////////////////////////////////////////////////////////////////////////////////-->    
    <header>
        <!--Buscador de que municipio quieres ver + que día para ver el tiempo-->
        <div class="buscadorMunicipio"> 
            <input type="text" class="inputBusqueda" placeholder="Escribe el nombre de un municipio...">
            <!--TO-DO: hacer que muestre una lista con los posibles resultados-->
            <!--Botón de búsqueda-->
            <button id="buscarMunicipio"><span>&#128269</span></buton>
            <!--Poner un botón al lado que sea para mostarr el pdf con la información de los municipios-->
            <button id="botonInformacion">(&#8505)</button>
        </div>

        <div class="contenedorError">
            <p class="codigoError">Hola soy un error :3</p>
        </div>

            <div class="pdf-container">
                <iframe src="src\assets\pdf\detalle_municipios_zonas_meteorologicas.pdf"></iframe>
            </div>
        <div class="botonesDia"> <!--Botones: Hoy | Mañana | Semana(o próximos 7 días)-->
            <button class="botonMostrarTiempoDe">Hoy</button>
            <button class="botonMostrarTiempoDe">Mañana</button>
            <button class="botonMostrarTiempoDe">Semana</button>
        </div>
    </header>
    <!--///////////////////////////////////////////////////////////////////////////////////////-->    
    <section>
        <div class="Fecha_Temperatura">
            <!--Fecha+hora-->
            <div class="fechaHora">
                <p class="fecha">Fecha</p> <p class="hora">Hora</p>
            </div>
            <!--Temp día y noche-->
            <div class="tempDiaNoche">
                <p class="tempDia">Temp.Día</p> <p class="tempNoche">Temp.Noche</p>
            </div>
        </div>
    <!--Temperatura actual + senación termica || imagenTiempo + descripción-->
        <p>TemperaturaActua</p>
        <p>Sensación Térmica</p>

        <p>Imagen Tiempo</p>
        <p>Descripción Tiempo</p>
    <!--humedad + viento + precipitacion-->
        <p>Humedad</p>
        <p>Viento</p>
        <p>Preticipación</p>
    </section>
    <!--///////////////////////////////////////////////////////////////////////////////////////-->
    <footer>
        <a href="https://www.flaticon.com/free-icons/smile" title="smile icons">Smile icons created by Magnific - Flaticon</a>
    </footer>
</body>
</html>
