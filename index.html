<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Unión con el JavaScript usando Módulos ES -->
    <script type="module" src="/src/appTiempo.js"></script>
    <!-- Unión con el CSS --> 
    <link rel="stylesheet" href="/src/appTiempo.css">

    <!-- Vínculo de las fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,100..900;1,8..30,100..900&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="src/assets/img/sun.png">
    <title>Tiempo</title>
</head>
<body>
    <!--No se acepta el uso del JavaScript por cualquier razón-->
    <noscript>
        <p>Este mensaje solo se muestra si JavaScript está desactivado</p>
    </noscript>
    <!--///////////////////////////////////////////////////////////////////////////////////////-->    
    <header>
        <!--Buscador de que municipio quieres ver + que día para ver el tiempo-->
        <div class="buscadorMunicipio"> 
            <input type="text" class="inputBusqueda" placeholder="Escribe el nombre de un municipio...">
            <!--TO-DO: hacer que muestre una lista con los posibles resultados-->
            <!--Botón de búsqueda-->
            <button id="buscarMunicipio"><span>&#128269;</span></buton>
            <!--Poner un botón al lado que sea para mostarr el pdf con la información de los municipios-->
            <button id="botonInformacion">(&#8505;)</button>
        </div>
        <!--Mensajes que salen debajo de la barra de búsqueda-->
            <!--Errores-->
        <div class="contenedorError">
            <p class="codigoError"></p>
        </div>

            <div class="pdf-container">
                <iframe src="src\assets\pdf\detalle_municipios_zonas_meteorologicas.pdf"></iframe>
            </div>
        <div class="botonesDia"> <!--Botones: Hoy | Mañana | Semana(o próximos 7 días)-->
            <button class="botonMostrarTiempoDe" id="hoy">Hoy</button>
            <button class="botonMostrarTiempoDe" id="mannana">Mañana</button>
        </div>
    </header>
    <!--///////////////////////////////////////////////////////////////////////////////////////-->    
    <section>
        <div class="Fecha_Temperatura">
            <!--Fecha+hora-->
            <div class="fechaHora">
                <p class="fecha">Fecha</p> <p class="hora">Hora</p>
            </div>
            <!--Temp día y noche-->
            <div class="tempMaxMin">
                <p class="tempMax">Temp.Max</p> <p class="tempMin">Temp.Min</p>
            </div>
        </div>
    <!--Temperatura actual + senación termica || imagenTiempo + descripción-->
        <div class="TempSensDescription">
            <div class="tempActSensTerm">
                <p class="temperaturaActual">TemperaturaActual</p>
                <p class="sensacionTermica">Sensación Térmica</p>
            </div>
            <div class="descripcionTiempoImagen">
                <div class="cajaImagenTiempo">
                    <img class="imagenTiempo" src="src/assets/img/sun.png"   alt="ImagenTiempo">
                </div>
                <p class="descripcionTiempo">Descripción Tiempo</p>
            </div>
        </div>
    <!--humedad + viento + precipitacion-->
    <div class="otrasInfo">
        <div class="caja">
            <img class="otrasImagenes" src="src/assets/img/humedad.png"   alt="ImagenTiempo">
            <p class="humedad">Humedad</p>
        </div>
        <div class="caja">
            <img class="otrasImagenes" src="src/assets/img/viento.png"   alt="ImagenTiempo">
            <p class="viento">Viento</p>
        </div>
        <div class="caja">
            <img class="otrasImagenes" src="src/assets/img/lluvia.png"   alt="ImagenTiempo">
            <p class="precipitacion">Preticipación</p>
        </div>
    </div>
    </section>
    <!--///////////////////////////////////////////////////////////////////////////////////////-->
</body>
</html>
